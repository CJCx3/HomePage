<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f1216" />
<meta name="description" content="Ledger — a private, offline budgeting app. Your money data never leaves this device." />
<title>Ledger</title>
<link rel="icon" href="icons/icon.svg" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app" id="app" hidden>

  <!-- ───────────────────────────  Top bar  ─────────────────────────── -->
  <header class="topbar">
    <div class="topbar__brand">
      <span class="brand__mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 5h16M4 5v14M4 12h16M8 5v14M8 9h4M8 15h6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </span>
      <span class="brand__name">Ledger</span>
    </div>

    <div class="monthnav" id="monthnav" role="group" aria-label="Select month">
      <button class="monthnav__btn" id="monthPrev" aria-label="Previous month">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="monthnav__label" id="monthLabel">Month</button>
      <button class="monthnav__btn" id="monthNext" aria-label="Next month">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="topbar__actions">
      <button class="iconbtn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">
        <svg class="ic-theme" viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v2M12 19v2M5 12H3M21 12h-2M6.3 6.3 4.9 4.9M19.1 19.1l-1.4-1.4M17.7 6.3l1.4-1.4M4.9 19.1l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
      </button>
      <button class="btn btn--primary btn--add" id="addBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Add</span>
      </button>
    </div>
  </header>

  <!-- ───────────────────────────  Views  ─────────────────────────── -->
  <main class="main" id="main">
    <section class="view" id="view-overview" data-view="overview"></section>
    <section class="view" id="view-accounts" data-view="accounts" hidden></section>
    <section class="view" id="view-transactions" data-view="transactions" hidden></section>
    <section class="view" id="view-budget" data-view="budget" hidden></section>
    <section class="view" id="view-reports" data-view="reports" hidden></section>
    <section class="view" id="view-settings" data-view="settings" hidden></section>
  </main>

  <!-- ───────────────────────────  Nav  ─────────────────────────── -->
  <nav class="nav" id="nav" aria-label="Sections">
    <button class="nav__item is-active" data-nav="overview">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z" fill="currentColor"/></svg>
      <span>Overview</span>
    </button>
    <button class="nav__item" data-nav="accounts">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 7h18v12H3zM3 10h18M7 15h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Accounts</span>
    </button>
    <button class="nav__item" data-nav="transactions">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h13M4 7l3-3M4 7l3 3M20 17H7M20 17l-3-3M20 17l-3 3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Ledger</span>
    </button>
    <button class="nav__item" data-nav="budget">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3a9 9 0 1 0 9 9h-9V3Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M13 3.5A8.5 8.5 0 0 1 20.5 11H13V3.5Z" fill="currentColor" opacity=".5"/></svg>
      <span>Budget</span>
    </button>
    <button class="nav__item" data-nav="reports">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 20V10M12 20V4M19 20v-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Reports</span>
    </button>
    <button class="nav__item" data-nav="settings">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.1 5.1l2.1 2.1M16.8 16.8l2.1 2.1M18.9 5.1l-2.1 2.1M7.2 16.8l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>Settings</span>
    </button>
  </nav>

</div>

<!-- ───────────────────────────  Modal host  ─────────────────────────── -->
<div class="modal" id="modal" hidden>
  <div class="modal__scrim" data-close></div>
  <div class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__head">
      <h2 class="modal__title" id="modalTitle">Title</h2>
      <button class="iconbtn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal__body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/store.js"></script>
<script src="js/icons.js"></script>
<script src="js/charts.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
